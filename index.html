<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cadastro de CEP - Emsoft</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="theme-color" content="#343351" />
  </head>
  <body>
    <header class="py-3 bg-emsoft text-white">
      <div class="container d-flex align-items-center gap-3">
        <img
          src="https://www.emsoft.inf.br/wp-content/uploads/2018/08/logo_horizontal_208x52_orange.png"
          alt="Emsoft"
          height="36"
        />
        <button id="themeToggle" class="btn btn-sm btn-dark ms-auto">
          🌙 Dark
        </button>
      </div>
    </header>

    <main class="container my-5">
      <div class="card-header">
        <h1 class="h5 mb-0 mb-4">Cadastro de Endereços por CEP</h1>
      </div>
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Consultar CEP</h2>

          <form id="cepForm" class="row g-2 align-items-center">
            <div class="col-12 col-sm-6">
              <label for="cep" class="form-label small"
                >CEP (somente números)</label
              >
              <input
                type="text"
                id="cep"
                name="cep"
                class="form-control shadow-sm"
                inputmode="numeric"
                maxlength="8"
                placeholder="Ex: 01310100"
                required
              />
            </div>
            <div class="col-auto mt-auto">
              <button type="submit" id="buscarBtn" class="btn btn-primary">
                Buscar
              </button>
            </div>
            <div class="col-12">
              <div id="cepFeedback" class="form-text text-danger d-none"></div>
            </div>
          </form>

          <div id="loading" class="d-none text-center mt-3">
            <div class="spinner-border" role="status"></div>
            <div class="mt-2 small text-muted">Consultando...</div>
          </div>

          <div id="addressCard" class="mt-4 d-none">
            <h3 class="h6">Endereço</h3>
            <form id="addressForm" class="row g-3">
              <div class="col-12">
                <label class="form-label small">Endereço (Logradouro)</label>
                <input
                  type="text"
                  id="endereco"
                  name="endereco"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label small">Bairro</label>
                <input
                  type="text"
                  id="bairro"
                  name="bairro"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label small">Cidade</label>
                <input
                  type="text"
                  id="cidade"
                  name="cidade"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label small">Estado</label>
                <input
                  type="text"
                  id="estado"
                  name="estado"
                  class="form-control"
                  maxlength="2"
                  required
                />
              </div>
              <div class="col-md-4">
                <label class="form-label small">País</label>
                <input
                  type="text"
                  id="pais"
                  name="pais"
                  class="form-control"
                  value="Brasil"
                  required
                />
              </div>

              <div class="col-12 d-flex gap-2">
                <button type="submit" id="enviarBtn" class="btn btn-success">
                  Enviar
                </button>
                <button
                  type="button"
                  id="voltarBtn"
                  class="btn btn-outline-secondary"
                >
                  Voltar
                </button>
              </div>

              <div class="col-12">
                <div id="saveFeedback" class="alert d-none" role="alert"></div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="py-3 text-center small text-muted">
      <p>
        Projeto de prova - Emsoft. Feito em HTML5, CSS3, Bootstrap e JavaScript
        puro. Backend em PHP.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
